<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود مشتری — WorkshopPro</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:#fff;border-radius:14px;padding:24px;max-width:380px;width:92%;box-shadow:0 2px 10px #0001}
h1{font-size:20px;margin:0 0 4px}p.sub{color:#667085;font-size:13px;margin:0 0 18px}
.tabs{display:flex;border:1px solid #e4e7eb;border-radius:9px;overflow:hidden;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:0;background:#f4f6f8;cursor:pointer;font-size:14px;color:#667085}
.tabs button.active{background:#1769aa;color:#fff}
label{display:block;margin:14px 0 6px;font-weight:bold;font-size:14px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd2d9;border-radius:9px;font-size:16px}
input[type=email],input[type=password]{direction:ltr;text-align:left}
button.primary{width:100%;border:0;border-radius:9px;padding:13px;font-size:15px;cursor:pointer;background:#1769aa;color:#fff;margin-top:16px}
button.primary:disabled{opacity:.5}
.muted{color:#667085;font-size:13px;margin-top:10px;text-align:center}
.err{color:#b42318;font-size:13px;margin-top:8px}
.ok{color:#087443;font-size:13px;margin-top:8px}
.hidden{display:none}
</style></head><body>

<div class="card">
  <h1>پنل مشتری</h1>
  <p class="sub">ورود یا ثبت‌نام با ایمیل و رمز عبور</p>

  <div class="tabs">
    <button id="tabLogin" class="active">ورود</button>
    <button id="tabSignup">ثبت‌نام</button>
  </div>

  <div id="panelLogin">
    <label>ایمیل</label>
    <input id="loginEmail" type="email" placeholder="you@example.com">
    <label>رمز عبور</label>
    <input id="loginPassword" type="password">
    <button class="primary" id="btnLogin">ورود</button>
    <div id="loginMsg"></div>
  </div>

  <div id="panelSignup" class="hidden">
    <label>نام شرکت / کسب‌وکار</label>
    <input id="companyName" type="text" placeholder="مثلاً شرکت تاج قطعه آسیا">
    <label>نام مسئول فنی (اختیاری)</label>
    <input id="contactName" type="text">
    <label>شماره موبایل</label>
    <input id="mobile" type="tel" placeholder="09121234567">
    <label>ایمیل</label>
    <input id="signupEmail" type="email" placeholder="you@example.com">
    <label>رمز عبور (حداقل ۶ کاراکتر)</label>
    <input id="signupPassword" type="password">
    <button class="primary" id="btnSignup">ثبت‌نام و ورود به پنل</button>
    <div id="signupMsg"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://tbsxccpkpklmvstyqwfk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRic3hjY3BrcGtsbXZzdHlxd2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjI0NDUsImV4cCI6MjEwMzgzODQ0NX0.PfpAn9oGekQRkEP8JJ3T1MnkeHF-rBNBQyNCMpLIeoo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tabLogin = document.getElementById("tabLogin");
const tabSignup = document.getElementById("tabSignup");
const panelLogin = document.getElementById("panelLogin");
const panelSignup = document.getElementById("panelSignup");

tabLogin.onclick = () => {
  tabLogin.classList.add("active"); tabSignup.classList.remove("active");
  panelLogin.classList.remove("hidden"); panelSignup.classList.add("hidden");
};
tabSignup.onclick = () => {
  tabSignup.classList.add("active"); tabLogin.classList.remove("active");
  panelSignup.classList.remove("hidden"); panelLogin.classList.add("hidden");
};

document.getElementById("btnLogin").onclick = async () => {
  const msg = document.getElementById("loginMsg");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  if(!email || !password){
    msg.innerHTML = '<div class="err">ایمیل و رمز عبور را کامل وارد کنید.</div>';
    return;
  }
  const btn = document.getElementById("btnLogin");
  btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if(error){
    msg.innerHTML = '<div class="err">'+error.message+'</div>';
    return;
  }
  window.location.href = "customer-dashboard.html";
};

document.getElementById("btnSignup").onclick = async () => {
  const msg = document.getElementById("signupMsg");
  const companyName = document.getElementById("companyName").value.trim();
  const contactName = document.getElementById("contactName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  if(!companyName || !email || password.length < 6){
    msg.innerHTML = '<div class="err">نام شرکت، ایمیل و رمز عبور (حداقل ۶ کاراکتر) الزامی است.</div>';
    return;
  }

  const btn = document.getElementById("btnSignup");
  btn.disabled = true;

  const { data: signUpData, error: signUpErr } = await sb.auth.signUp({ email, password });
  if(signUpErr){
    btn.disabled = false;
    msg.innerHTML = '<div class="err">'+signUpErr.message+'</div>';
    return;
  }

  const user = signUpData.user;
  if(!user){
    btn.disabled = false;
    msg.innerHTML = '<div class="ok">لینک تایید به ایمیل شما ارسال شد. بعد از تایید ایمیل وارد شوید.</div>';
    return;
  }

  const custCode = "CUS-" + Date.now().toString().slice(-8);
  const { data: customer, error: custErr } = await sb
    .from("customers")
    .insert({ code: custCode, name: companyName, mobile: mobile || null, source: "self_signup" })
    .select("id")
    .single();

  if(custErr){
    btn.disabled = false;
    msg.innerHTML = '<div class="err">خطا در ساخت مشتری: '+custErr.message+'</div>';
    return;
  }

  const { error: profErr } = await sb
    .from("user_profiles")
    .upsert({
      id: user.id,
      full_name: contactName || companyName,
      role: "customer",
      customer_id: customer.id,
    });

  btn.disabled = false;
  if(profErr){
    msg.innerHTML = '<div class="err">خطا در ساخت پروفایل: '+profErr.message+'</div>';
    return;
  }

  window.location.href = "customer-dashboard.html";
};
</script>
</body></html>
