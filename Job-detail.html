<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جزئیات کار — WorkshopPro</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}
.top{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px #0001;position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0}
.top a{color:#1769aa;text-decoration:none;font-size:13px}
.wrap{padding:14px;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
.card h3{margin:0 0 10px;font-size:15px;border-bottom:1px solid #eee;padding-bottom:8px}
.meta{font-size:12px;color:#667085;margin-bottom:6px}
label{display:block;margin:12px 0 6px;font-weight:bold;font-size:13px}
input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd2d9;border-radius:9px;font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
button.primary{border:0;border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer;background:#1769aa;color:#fff;margin-top:12px}
button.primary:disabled{opacity:.5}
button.secondary{border:1px solid #ccd2d9;border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer;background:#fff;color:#17202a;margin-top:12px;margin-inline-end:8px}
.err{color:#b42318;font-size:13px;margin-top:8px}
.ok{color:#087443;font-size:13px;margin-top:8px}
.report-box{background:#fff4e5;border:1px solid #fec84b;border-radius:9px;padding:12px;font-size:13px;line-height:1.8}
.row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed #eee}
.row:last-child{border-bottom:0}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;margin-inline-start:6px;background:#eef2ff;color:#3538cd}
.stockok{color:#087443;font-weight:bold}
.stockbad{color:#b42318;font-weight:bold}
.hidden{display:none}
.tinylist .row{align-items:center}
</style></head><body>

<div class="top">
  <h1 id="jobTitle">جزئیات کار</h1>
  <a href="admin-panel.html">بازگشت</a>
</div>

<div class="wrap">

  <div class="card" id="reportCard">
    <h3>مشکل اعلام‌شده توسط مشتری</h3>
    <div class="meta" id="jobMeta"></div>
    <div class="report-box" id="customerReport">در حال بارگذاری...</div>
  </div>

  <!-- مشخصات دستگاه -->
  <div class="card">
    <h3>مشخصات دستگاه</h3>
    <div id="equipmentDisplay"></div>
    <div id="equipmentForm" class="hidden">
      <label>دسته‌بندی</label>
      <input id="eqCategory" placeholder="مثلاً لیفتراک، ریچ‌استاکر">
      <label>برند</label>
      <input id="eqBrand">
      <label>مدل</label>
      <input id="eqModel">
      <label>شماره سریال</label>
      <input id="eqSerial">
      <label>نوع انرژی</label>
      <select id="eqEnergy">
        <option value="">-</option>
        <option value="برقی">برقی</option>
        <option value="دیزل">دیزل</option>
        <option value="گازی">گازی</option>
      </select>
      <label>ساعت کارکرد</label>
      <input id="eqHours" type="number">
      <label>یادداشت</label>
      <textarea id="eqNotes"></textarea>
      <label>عکس دستگاه</label>
      <input id="eqPhoto" type="file" accept="image/*">
      <button class="primary" id="btnSaveEquipment">ثبت مشخصات دستگاه</button>
      <div id="eqMsg"></div>
    </div>
  </div>

  <!-- عیب یابی -->
  <div class="card">
    <h3>عیب‌یابی</h3>
    <div id="diagnosisList"></div>
    <label>علامت / مشاهده</label>
    <textarea id="dxSymptom"></textarea>
    <label>کد خطا (اختیاری)</label>
    <input id="dxError">
    <label>تست انجام‌شده</label>
    <textarea id="dxTest"></textarea>
    <label>نتیجه‌ی تست</label>
    <textarea id="dxResult"></textarea>
    <label>علت احتمالی / قطعی</label>
    <input id="dxCause">
    <label>پیشنهاد تعمیر یا تعویض</label>
    <textarea id="dxRecommend"></textarea>
    <button class="primary" id="btnSaveDiagnosis">ثبت عیب‌یابی</button>
    <div id="dxMsg"></div>
  </div>

  <!-- درخواست قطعه یا خدمات -->
  <div class="card">
    <h3>درخواست قطعه یا خدمات</h3>
    <div id="sourcingList"></div>
    <label>نوع</label>
    <select id="reqKind">
      <option value="part">قطعه (چک موجودی انبار)</option>
      <option value="service">خدمات برون‌سپاری</option>
    </select>

    <div id="partSection">
      <label>جستجوی قطعه</label>
      <input id="partSearch" placeholder="نام قطعه را تایپ کنید...">
      <div id="partResults"></div>
      <div id="selectedPartBox" class="hidden">
        <div class="row"><span>قطعه انتخابی</span><span id="selPartName"></span></div>
        <div class="row"><span>موجودی انبار</span><span id="selPartStock"></span></div>
        <label>تعداد مورد نیاز</label>
        <input id="reqQty" type="number" value="1" min="1">
        <button class="primary" id="btnSubmitPartReq">ثبت درخواست</button>
      </div>
    </div>

    <div id="serviceSection" class="hidden">
      <label>شرح خدمات مورد نیاز</label>
      <textarea id="serviceDesc" placeholder="مثلاً برون‌سپاری تعمیر برد کنترلر..."></textarea>
      <button class="primary" id="btnSubmitServiceReq">ثبت درخواست خدمات</button>
    </div>

    <div id="reqMsg"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://tbsxccpkpklmvstyqwfk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRic3hjY3BrcGtsbXZzdHlxd2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjI0NDUsImV4cCI6MjEwMzgzODQ0NX0.PfpAn9oGekQRkEP8JJ3T1MnkeHF-rBNBQyNCMpLIeoo";

if(typeof supabase === "undefined"){
  document.body.innerHTML = '<div class="wrap"><div class="card err">کتابخانه‌ی اتصال به سرور لود نشد.</div></div>';
  throw new Error("supabase-js failed to load");
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const jobId = params.get("id");

let currentUser = null;
let job = null;
let selectedPart = null;

function fmtDate(d){ if(!d) return "-"; try{ return new Date(d).toLocaleDateString('fa-IR'); }catch(e){ return d; } }

async function init(){
  if(!jobId){
    document.querySelector(".wrap").innerHTML = '<div class="card err">شناسه‌ی کار مشخص نیست.</div>';
    return;
  }
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ window.location.href = "admin-panel.html"; return; }
  currentUser = user;

  const { data: profile } = await sb.from("user_profiles").select("role").eq("id", user.id).maybeSingle();
  if(!profile || !["admin","technician","warehouse_sales"].includes(profile.role)){
    document.querySelector(".wrap").innerHTML = '<div class="card err">دسترسی ندارید.</div>';
    return;
  }

  await loadJob();
  await loadDiagnosis();
  await loadSourcing();
}

async function loadJob(){
  const { data, error } = await sb.from("jobs")
    .select("id,code,status,customer_id,equipment_id,service_request_id,customers(name),service_requests(description,request_type)")
    .eq("id", jobId).maybeSingle();

  if(error || !data){
    document.querySelector(".wrap").innerHTML = '<div class="card err">کار پیدا نشد.</div>';
    return;
  }
  job = data;
  document.getElementById("jobTitle").textContent = "کار " + job.code;
  document.getElementById("jobMeta").textContent = "مشتری: " + (job.customers ? job.customers.name : "-");
  document.getElementById("customerReport").textContent =
    job.service_requests ? (job.service_requests.description || "توضیحی ثبت نشده") : "درخواستی مرتبط یافت نشد";

  await loadEquipmentSection();
}

async function loadEquipmentSection(){
  const el = document.getElementById("equipmentDisplay");
  const form = document.getElementById("equipmentForm");

  if(job.equipment_id){
    const { data: eq } = await sb.from("equipment").select("*").eq("id", job.equipment_id).maybeSingle();
    if(eq){
      el.innerHTML = `
        <div class="row"><span>دسته‌بندی</span><span>${eq.category||"-"}</span></div>
        <div class="row"><span>برند / مدل</span><span>${eq.brand||"-"} / ${eq.model||"-"}</span></div>
        <div class="row"><span>سریال</span><span>${eq.serial_number||"-"}</span></div>
        <div class="row"><span>نوع انرژی</span><span>${eq.energy_type||"-"}</span></div>
        <div class="row"><span>ساعت کارکرد</span><span>${eq.operating_hours||"-"}</span></div>
        ${eq.photo_url ? '<img src="'+eq.photo_url+'" style="width:100%;border-radius:9px;margin-top:8px">' : ""}
      `;
      form.classList.add("hidden");
      return;
    }
  }
  el.innerHTML = '<div class="meta">مشخصات دستگاه هنوز ثبت نشده.</div>';
  form.classList.remove("hidden");
}

document.getElementById("btnSaveEquipment").onclick = async () => {
  const msg = document.getElementById("eqMsg");
  const btn = document.getElementById("btnSaveEquipment");
  btn.disabled = true;

  let photoUrl = null;
  const fileInput = document.getElementById("eqPhoto");
  if(fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    const path = job.customer_id + "/" + Date.now() + "_" + file.name;
    const { error: upErr } = await sb.storage.from("equipment-photos").upload(path, file);
    if(upErr){
      btn.disabled = false;
      msg.innerHTML = '<div class="err">خطا در آپلود عکس: '+upErr.message+'</div>';
      return;
    }
    const { data: pub } = sb.storage.from("equipment-photos").getPublicUrl(path);
    photoUrl = pub.publicUrl;
  }

  const eqCode = "EQ-" + Date.now().toString().slice(-8);
  const { data: eq, error: eqErr } = await sb.from("equipment").insert({
    code: eqCode,
    customer_id: job.customer_id,
    category: document.getElementById("eqCategory").value.trim(),
    brand: document.getElementById("eqBrand").value.trim(),
    model: document.getElementById("eqModel").value.trim(),
    serial_number: document.getElementById("eqSerial").value.trim(),
    energy_type: document.getElementById("eqEnergy").value,
    operating_hours: document.getElementById("eqHours").value || null,
    notes: document.getElementById("eqNotes").value.trim(),
    photo_url: photoUrl
  }).select("id").single();

  if(eqErr){
    btn.disabled = false;
    msg.innerHTML = '<div class="err">خطا: '+eqErr.message+'</div>';
    return;
  }

  const { error: jobErr } = await sb.from("jobs").update({ equipment_id: eq.id }).eq("id", jobId);
  btn.disabled = false;
  if(jobErr){
    msg.innerHTML = '<div class="err">دستگاه ثبت شد ولی خطا در اتصال به کار: '+jobErr.message+'</div>';
    return;
  }
  job.equipment_id = eq.id;
  msg.innerHTML = '<div class="ok">ثبت شد.</div>';
  loadEquipmentSection();
};

// عیب یابی
async function loadDiagnosis(){
  const el = document.getElementById("diagnosisList");
  const { data, error } = await sb.from("diagnosis")
    .select("*").eq("job_id", jobId).order("created_at", { ascending:false });
  if(error || !data || data.length===0){ el.innerHTML = ""; return; }
  el.innerHTML = data.map(d => `
    <div class="row" style="display:block;padding:8px 0">
      <div class="meta">${fmtDate(d.created_at)}</div>
      <div><b>علامت:</b> ${d.symptom||"-"}</div>
      ${d.probable_cause ? '<div><b>علت:</b> '+d.probable_cause+'</div>' : ""}
      ${d.repair_recommendation ? '<div><b>پیشنهاد:</b> '+d.repair_recommendation+'</div>' : ""}
    </div>
  `).join("");
}

document.getElementById("btnSaveDiagnosis").onclick = async () => {
  const msg = document.getElementById("dxMsg");
  const symptom = document.getElementById("dxSymptom").value.trim();
  if(!symptom){
    msg.innerHTML = '<div class="err">علامت / مشاهده را وارد کنید.</div>';
    return;
  }
  const btn = document.getElementById("btnSaveDiagnosis");
  btn.disabled = true;

  const { error } = await sb.from("diagnosis").insert({
    job_id: jobId,
    symptom,
    error_code: document.getElementById("dxError").value.trim(),
    test_performed: document.getElementById("dxTest").value.trim(),
    test_result: document.getElementById("dxResult").value.trim(),
    probable_cause: document.getElementById("dxCause").value.trim(),
    repair_recommendation: document.getElementById("dxRecommend").value.trim(),
    created_by: currentUser.id
  });

  if(error){
    btn.disabled = false;
    msg.innerHTML = '<div class="err">خطا: '+error.message+'</div>';
    return;
  }

  await sb.from("jobs").update({ status: "diagnosis" }).eq("id", jobId).eq("status","received");

  btn.disabled = false;
  msg.innerHTML = '<div class="ok">ثبت شد.</div>';
  ["dxSymptom","dxError","dxTest","dxResult","dxCause","dxRecommend"].forEach(id=>document.getElementById(id).value="");
  loadDiagnosis();
};

// درخواست قطعه یا خدمات
document.getElementById("reqKind").onchange = (e) => {
  const isPart = e.target.value === "part";
  document.getElementById("partSection").classList.toggle("hidden", !isPart);
  document.getElementById("serviceSection").classList.toggle("hidden", isPart);
};

let searchTimer = null;
document.getElementById("partSearch").oninput = (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if(q.length < 2){ document.getElementById("partResults").innerHTML = ""; return; }
  searchTimer = setTimeout(async () => {
    const { data, error } = await sb.from("parts").select("id,name,code").ilike("name", "%"+q+"%").limit(8);
    const el = document.getElementById("partResults");
    if(error || !data || data.length===0){ el.innerHTML = '<div class="meta">نتیجه‌ای یافت نشد.</div>'; return; }
    el.innerHTML = data.map(p => `<div class="row" style="cursor:pointer" onclick="selectPart('${p.id}','${p.name.replace(/'/g,"")}')"><span>${p.name}</span><span>${p.code}</span></div>`).join("");
  }, 350);
};

async function selectPart(id, name){
  selectedPart = { id, name };
  document.getElementById("selPartName").textContent = name;
  document.getElementById("partResults").innerHTML = "";
  document.getElementById("partSearch").value = name;
  document.getElementById("selectedPartBox").classList.remove("hidden");

  const { data: stockData } = await sb.from("stock_balance").select("quantity").eq("id", id).maybeSingle();
  const qty = stockData ? stockData.quantity : 0;
  document.getElementById("selPartStock").innerHTML = qty > 0
    ? '<span class="stockok">'+qty+' عدد موجود</span>'
    : '<span class="stockbad">موجود نیست</span>';
  selectedPart.stock = qty;
}
window.selectPart = selectPart;

document.getElementById("btnSubmitPartReq").onclick = async () => {
  const msg = document.getElementById("reqMsg");
  if(!selectedPart){ msg.innerHTML = '<div class="err">یک قطعه انتخاب کنید.</div>'; return; }
  const needed = Number(document.getElementById("reqQty").value) || 1;
  const btn = document.getElementById("btnSubmitPartReq");
  btn.disabled = true;

  if(selectedPart.stock >= needed){
    const { error } = await sb.from("stock_movements").insert({
      part_id: selectedPart.id, quantity: needed, reason: "repair",
      job_id: jobId, customer_id: job.customer_id, created_by: currentUser.id
    });
    btn.disabled = false;
    if(error){ msg.innerHTML = '<div class="err">خطا: '+error.message+'</div>'; return; }
    await sb.from("jobs").update({ status: "repairing" }).eq("id", jobId);
    msg.innerHTML = '<div class="ok">قطعه از انبار رزرو شد.</div>';
  } else {
    const code = "SRC-" + Date.now().toString().slice(-8);
    const { error } = await sb.from("sourcing_requests").insert({
      code, customer_id: job.customer_id, job_id: jobId, requested_by: currentUser.id,
      part_id: selectedPart.id, item_name: selectedPart.name, quantity: needed,
      priority: "normal", status: "new"
    });
    btn.disabled = false;
    if(error){ msg.innerHTML = '<div class="err">خطا: '+error.message+'</div>'; return; }
    await sb.from("jobs").update({ status: "sourcing" }).eq("id", jobId);
    msg.innerHTML = '<div class="ok">موجودی کافی نبود؛ درخواست تأمین برای مدیر ارسال شد.</div>';
  }
  loadSourcing();
};

document.getElementById("btnSubmitServiceReq").onclick = async () => {
  const msg = document.getElementById("reqMsg");
  const desc = document.getElementById("serviceDesc").value.trim();
  if(!desc){ msg.innerHTML = '<div class="err">شرح خدمات را وارد کنید.</div>'; return; }
  const btn = document.getElementById("btnSubmitServiceReq");
  btn.disabled = true;

  const code = "SRC-" + Date.now().toString().slice(-8);
  const { error } = await sb.from("sourcing_requests").insert({
    code, customer_id: job.customer_id, job_id: jobId, requested_by: currentUser.id,
    item_name: desc, quantity: 1, priority: "normal", status: "new"
  });
  btn.disabled = false;
  if(error){ msg.innerHTML = '<div class="err">خطا: '+error.message+'</div>'; return; }
  await sb.from("jobs").update({ status: "sourcing" }).eq("id", jobId);
  msg.innerHTML = '<div class="ok">درخواست خدمات برون‌سپاری برای مدیر ارسال شد.</div>';
  document.getElementById("serviceDesc").value = "";
  loadSourcing();
};

async function loadSourcing(){
  const el = document.getElementById("sourcingList");
  const { data, error } = await sb.from("sourcing_requests")
    .select("id,item_name,quantity,status,created_at").eq("job_id", jobId).order("created_at",{ascending:false});
  if(error || !data || data.length===0){ el.innerHTML = ""; return; }
  el.innerHTML = data.map(s => `
    <div class="row"><span>${s.item_name} (${s.quantity})</span><span class="badge">${s.status}</span></div>
  `).join("");
}

init();
</script>
</body></html>
