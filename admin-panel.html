<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت — WorkshopPro</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}
.center{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:14px;padding:24px;max-width:380px;width:100%;box-shadow:0 2px 10px #0001}
h1{font-size:20px;margin:0 0 4px}p.sub{color:#667085;font-size:13px;margin:0 0 18px}
label{display:block;margin:14px 0 6px;font-weight:bold;font-size:14px}
input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd2d9;border-radius:9px;font-size:15px;font-family:inherit}
input[type=email],input[type=password]{direction:ltr;text-align:left}
button.primary{width:100%;border:0;border-radius:9px;padding:13px;font-size:15px;cursor:pointer;background:#1769aa;color:#fff;margin-top:16px}
button.primary:disabled{opacity:.5}
.err{color:#b42318;font-size:13px;margin-top:8px}
.ok{color:#087443;font-size:13px;margin-top:8px}
.hidden{display:none}

.top{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px #0001;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0}
.top button{border:0;background:#f4f6f8;color:#b42318;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #e4e7eb;position:sticky;top:53px;z-index:4}
.tabs button{flex:0 0 auto;padding:12px 14px;border:0;background:none;font-size:13px;color:#667085;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.active{color:#1769aa;border-color:#1769aa;font-weight:bold}
.wrap{padding:14px;max-width:640px;margin:0 auto}
.page{display:none}
.page.active{display:block}
.listcard{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.listcard h3{margin:0 0 8px;font-size:15px}
.listcard .meta{font-size:12px;color:#667085;margin-bottom:6px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;margin-inline-start:6px}
.badge.new{background:#eef2ff;color:#3538cd}
.badge.approved,.badge.delivered,.badge.closed{background:#ecfdf3;color:#087443}
.badge.received,.badge.diagnosis{background:#fff4e5;color:#b54708}
.badge.customer_rejected,.badge.cancelled{background:#fef3f2;color:#b42318}
.empty{color:#98a2b3;font-size:13px;text-align:center;padding:30px 0}
button.approve{background:#087443;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;margin-top:8px;margin-inline-end:6px}
button.reject{background:#fff;color:#b42318;border:1px solid #b42318;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;margin-top:8px}
</style></head><body>

<!-- ورود مدیر -->
<div id="loginScreen" class="center">
  <div class="card">
    <h1>ورود کارکنان</h1>
    <p class="sub">ورود مخصوص مدیر / تکنسین / انبار</p>
    <label>ایمیل</label>
    <input id="loginEmail" type="email" placeholder="you@example.com">
    <label>رمز عبور</label>
    <input id="loginPassword" type="password">
    <button class="primary" id="btnLogin">ورود</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- پنل اصلی -->
<div id="mainScreen" class="hidden">
  <div class="top">
    <h1>پنل مدیریت</h1>
    <button id="btnLogout">خروج</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-page="pRequests">درخواست‌های مشتریان</button>
    <button class="tab" data-page="pJobs">کارها (Job)</button>
    <button class="tab" data-page="pSourcing" id="tabSourcing">تأمین</button>
  </div>
  <div class="wrap">

    <div id="pRequests" class="page active">
      <div id="requestsList"><div class="empty">در حال بارگذاری...</div></div>
    </div>

    <div id="pJobs" class="page">
      <div id="jobsList"><div class="empty">در حال بارگذاری...</div></div>
    </div>

    <div id="pSourcing" class="page">
      <div class="listcard">
        <h3 style="margin:0 0 8px;font-size:14px">ثبت قیمت روز بازار برای یک قطعه</h3>
        <input id="mpPartSearch" placeholder="نام قطعه را تایپ کنید...">
        <div id="mpPartResults"></div>
        <div id="mpSelectedBox" class="hidden" style="margin-top:8px">
          <div class="meta">قطعه: <span id="mpSelName"></span> — قیمت فروش داخلی: <span id="mpSelPrice"></span></div>
        <div style="margin:8px 0">
          <a id="mpTorobLink" href="#" target="_blank" class="secondary" style="display:inline-block;text-decoration:none;border:1px solid #ccd2d9;border-radius:8px;padding:8px 12px;font-size:13px;margin-inline-end:6px">جستجو در ترب 🔗</a>
          <a id="mpGoogleLink" href="#" target="_blank" class="secondary" style="display:inline-block;text-decoration:none;border:1px solid #ccd2d9;border-radius:8px;padding:8px 12px;font-size:13px">جستجو در گوگل 🔗</a>
        </div>
          <input id="mpPrice" type="number" placeholder="قیمت روز بازار (ریال)" style="margin-top:6px">
          <input id="mpSource" placeholder="منبع (مثلاً دیجی‌کالا، لاله‌زار...)" style="margin-top:6px">
          <button class="approve" id="btnSaveMarketPrice" style="margin-top:8px">ثبت قیمت بازار</button>
        </div>
        <div id="mpMsg"></div>
      </div>

      <h3 style="font-size:14px;margin:16px 0 8px">درخواست‌های تأمین در انتظار استعلام</h3>
      <div id="pendingSourcingList"><div class="empty">در حال بارگذاری...</div></div>

      <h3 style="font-size:14px;margin:16px 0 8px">سفارش‌های در حال تأمین</h3>
      <div id="orderedSourcingList"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://tbsxccpkpklmvstyqwfk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRic3hjY3BrcGtsbXZzdHlxd2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjI0NDUsImV4cCI6MjEwMzgzODQ0NX0.PfpAn9oGekQRkEP8JJ3T1MnkeHF-rBNBQyNCMpLIeoo";

if(typeof supabase === "undefined"){
  document.body.innerHTML = '<div class="center"><div class="card err">کتابخانه‌ی اتصال به سرور لود نشد. اینترنت/فیلترشکن را بررسی کنید.</div></div>';
  throw new Error("supabase-js failed to load");
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TYPE_LABELS = {
  sell_equipment: "فروش دستگاه", buy_equipment: "خرید دستگاه",
  buy_part: "خرید قطعه", buy_service: "درخواست خدمات"
};
const STATUS_LABELS = {
  new:"جدید", received:"دریافت شد", diagnosis:"در حال بررسی", waiting_quote:"در انتظار پیش‌فاکتور",
  waiting_customer:"در انتظار تایید مشتری", approved:"تایید شده", repairing:"در حال تعمیر",
  waiting_part:"در انتظار قطعه", sourcing:"در حال تأمین", waiting_purchase:"در انتظار خرید",
  final_test:"تست نهایی", ready_delivery:"آماده تحویل", delivered:"تحویل شده", closed:"بسته شده",
  cancelled:"لغو شده", customer_rejected:"رد شده توسط مشتری", customer_hold:"معلق"
};
function badge(status){
  return '<span class="badge '+(status||'')+'">'+(STATUS_LABELS[status]||status||"-")+'</span>';
}
function fmtDate(d){ if(!d) return "-"; try{ return new Date(d).toLocaleDateString('fa-IR'); }catch(e){ return d; } }

let currentUser = null;
let myRole = null;

async function checkSession(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return showLogin();

  const { data: profile, error } = await sb
    .from("user_profiles").select("role,full_name").eq("id", user.id).maybeSingle();

  if(error || !profile || !["admin","technician","warehouse_sales"].includes(profile.role)){
    document.getElementById("loginMsg").innerHTML = '<div class="err">این حساب دسترسی به پنل مدیریت را ندارد.</div>';
    await sb.auth.signOut();
    return showLogin();
  }

  currentUser = user;
  myRole = profile.role;
  const roleLabels = { admin: "پنل مدیریت", technician: "پنل تکنسین", warehouse_sales: "پنل انبار و فروش" };
  document.querySelector(".top h1").textContent = roleLabels[myRole] || "پنل کارکنان";

  if(myRole === "technician"){
    const reqTab = document.querySelector('.tab[data-page="pRequests"]');
    reqTab.classList.add("hidden");
    document.getElementById("tabSourcing").classList.add("hidden");
    document.querySelector('.tab[data-page="pJobs"]').click();
  }

  showMain();
}

function showLogin(){
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("mainScreen").classList.add("hidden");
}
function showMain(){
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
  loadRequests();
  loadJobs();
  loadPendingSourcing();
  loadOrderedSourcing();
}

document.getElementById("btnLogin").onclick = async () => {
  const msg = document.getElementById("loginMsg");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  if(!email || !password){
    msg.innerHTML = '<div class="err">ایمیل و رمز عبور را کامل وارد کنید.</div>';
    return;
  }
  const btn = document.getElementById("btnLogin");
  btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false;
  if(error){
    msg.innerHTML = '<div class="err">'+error.message+'</div>';
    return;
  }
  msg.innerHTML = "";
  checkSession();
};

document.getElementById("btnLogout").onclick = async () => {
  await sb.auth.signOut();
  showLogin();
};

document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.page).classList.add("active");
  };
});

// لیست درخواست‌های مشتریان
async function loadRequests(){
  const el = document.getElementById("requestsList");
  const { data, error } = await sb.from("service_requests")
    .select("id,code,request_type,description,status,requested_at,customer_id,customers(name,mobile)")
    .order("requested_at", { ascending:false });

  if(error){ el.innerHTML = '<div class="listcard err">خطا: '+error.message+'</div>'; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="empty">درخواستی ثبت نشده.</div>'; return; }

  el.innerHTML = data.map(r => `
    <div class="listcard" id="req-${r.id}">
      <h3>${TYPE_LABELS[r.request_type]||r.request_type} ${badge(r.status)}</h3>
      <div class="meta">مشتری: ${r.customers ? r.customers.name : "-"} — کد: ${r.code} — ${fmtDate(r.requested_at)}</div>
      <div>${(r.description||"").replace(/</g,"&lt;")}</div>
      ${r.status === "new" ? `
        <button class="approve" onclick="approveRequest('${r.id}','${r.customer_id}')">تایید و شروع پذیرش (ساخت Job)</button>
        <button class="reject" onclick="rejectRequest('${r.id}')">رد درخواست</button>
      ` : ""}
      <div id="reqmsg-${r.id}"></div>
    </div>
  `).join("");
}

async function approveRequest(reqId, customerId){
  const msg = document.getElementById("reqmsg-"+reqId);
  const jobCode = "JOB-" + Date.now().toString().slice(-8);

  const { error: jobErr } = await sb.from("jobs").insert({
    code: jobCode,
    service_request_id: reqId,
    customer_id: customerId,
    status: "received"
  });
  if(jobErr){
    msg.innerHTML = '<div class="err">خطا در ساخت Job: '+jobErr.message+'</div>';
    return;
  }

  const { error: updErr } = await sb.from("service_requests")
    .update({ status: "approved" }).eq("id", reqId);
  if(updErr){
    msg.innerHTML = '<div class="err">Job ساخته شد ولی خطا در آپدیت درخواست: '+updErr.message+'</div>';
    return;
  }

  loadRequests();
  loadJobs();
}
window.approveRequest = approveRequest;

async function rejectRequest(reqId){
  const msg = document.getElementById("reqmsg-"+reqId);
  const { error } = await sb.from("service_requests")
    .update({ status: "cancelled" }).eq("id", reqId);
  if(error){
    msg.innerHTML = '<div class="err">خطا: '+error.message+'</div>';
    return;
  }
  loadRequests();
}
window.rejectRequest = rejectRequest;

// لیست Jobها
async function loadJobs(){
  const el = document.getElementById("jobsList");
  const { data, error } = await sb.from("jobs")
    .select("id,code,status,created_at,customers(name)")
    .order("created_at", { ascending:false });

  if(error){ el.innerHTML = '<div class="listcard err">خطا: '+error.message+'</div>'; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="empty">هنوز Job ای ساخته نشده.</div>'; return; }

  el.innerHTML = data.map(j => `
    <div class="listcard" style="cursor:pointer" onclick="location.href='job-detail.html?id=${j.id}'">
      <h3>Job ${j.code} ${badge(j.status)}</h3>
      <div class="meta">مشتری: ${j.customers ? j.customers.name : "-"} — تاریخ: ${fmtDate(j.created_at)}</div>
    </div>
  `).join("");
}

// ================= تأمین =================

function totalCost(q){
  return (Number(q.purchase_price)||0) + (Number(q.shipping_cost)||0) + (Number(q.intermediary_cost)||0)
    + (Number(q.packaging_cost)||0) + (Number(q.transfer_cost)||0) + (Number(q.customs_cost)||0)
    + (Number(q.currency_risk_cost)||0);
}
function riskPenalty(level){
  return level === "high" ? 0.15 : level === "medium" ? 0.05 : 0;
}
function quoteScore(q){
  const cost = totalCost(q);
  const days = Number(q.estimated_delivery_days) || 999;
  return cost * (1 + days*0.01) * (1 + riskPenalty(q.risk_level));
}

async function loadPendingSourcing(){
  const el = document.getElementById("pendingSourcingList");
  const { data, error } = await sb.from("sourcing_requests")
    .select("id,code,item_name,quantity,status,priority,part_id,job_id,created_at")
    .in("status", ["new","quoting","offers_received"])
    .order("created_at", { ascending:false });

  if(error){ el.innerHTML = '<div class="listcard err">خطا: '+error.message+'</div>'; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="empty">درخواست تأمینی در انتظار نیست.</div>'; return; }

  el.innerHTML = "";
  for(const s of data){
    const box = document.createElement("div");
    box.className = "listcard";
    box.id = "src-"+s.id;
    box.innerHTML = `
      <h3>${s.item_name} (${s.quantity} عدد) ${badge(s.status)}</h3>
      <div class="meta">کد: ${s.code} — ${fmtDate(s.created_at)} — اولویت: ${s.priority}</div>
      <div id="quotes-${s.id}"></div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px dashed #eee">
        <div class="meta" style="margin-bottom:6px">ثبت پیشنهاد جدید تأمین‌کننده</div>
        <input id="qSupplier-${s.id}" placeholder="نام تأمین‌کننده">
        <input id="qPrice-${s.id}" type="number" placeholder="قیمت خرید (ریال)" style="margin-top:6px">
        <input id="qShip-${s.id}" type="number" placeholder="هزینه حمل (ریال)" style="margin-top:6px">
        <input id="qDays-${s.id}" type="number" placeholder="مدت تحویل (روز)" style="margin-top:6px">
        <select id="qRisk-${s.id}" style="margin-top:6px">
          <option value="low">ریسک کم</option>
          <option value="medium">ریسک متوسط</option>
          <option value="high">ریسک بالا</option>
        </select>
        <button class="approve" onclick="addQuote('${s.id}')">افزودن پیشنهاد</button>
        <div id="qmsg-${s.id}"></div>
      </div>
    `;
    el.appendChild(box);
    loadQuotesFor(s.id);
  }
}

async function loadQuotesFor(sourcingId){
  const el = document.getElementById("quotes-"+sourcingId);
  const { data, error } = await sb.from("supplier_quotes")
    .select("id,purchase_price,shipping_cost,intermediary_cost,packaging_cost,transfer_cost,customs_cost,currency_risk_cost,estimated_delivery_days,risk_level,suppliers(name)")
    .eq("sourcing_request_id", sourcingId);

  if(error || !data || data.length===0){ el.innerHTML = '<div class="meta">هنوز پیشنهادی ثبت نشده.</div>'; return; }

  let best = null;
  data.forEach(q => { q._total = totalCost(q); q._score = quoteScore(q); if(!best || q._score < best._score) best = q; });

  el.innerHTML = data.map(q => `
    <div class="row" style="display:block;padding:8px 0">
      <div><b>${q.suppliers ? q.suppliers.name : "-"}</b> ${q.id===best.id ? '<span class="badge approved">پیشنهاد سیستم ✓</span>' : ""}</div>
      <div class="meta">قیمت تمام‌شده: ${q._total.toLocaleString('fa-IR')} ریال — تحویل: ${q.estimated_delivery_days||"-"} روز — ریسک: ${q.risk_level||"-"}</div>
      <button class="approve" style="font-size:12px;padding:6px 10px" onclick="chooseQuote('${sourcingId}','${q.id}','${q._total}')">ثبت خرید با این گزینه</button>
    </div>
  `).join("");
}

async function addQuote(sourcingId){
  const msg = document.getElementById("qmsg-"+sourcingId);
  const supplierName = document.getElementById("qSupplier-"+sourcingId).value.trim();
  const price = Number(document.getElementById("qPrice-"+sourcingId).value) || 0;
  const ship = Number(document.getElementById("qShip-"+sourcingId).value) || 0;
  const days = Number(document.getElementById("qDays-"+sourcingId).value) || null;
  const risk = document.getElementById("qRisk-"+sourcingId).value;

  if(!supplierName || !price){
    msg.innerHTML = '<div class="err">نام تأمین‌کننده و قیمت را وارد کنید.</div>';
    return;
  }

  let { data: supplier } = await sb.from("suppliers").select("id").ilike("name", supplierName).maybeSingle();
  if(!supplier){
    const supCode = "SUP-" + Date.now().toString().slice(-8);
    const { data: newSup, error: supErr } = await sb.from("suppliers")
      .insert({ code: supCode, name: supplierName }).select("id").single();
    if(supErr){ msg.innerHTML = '<div class="err">خطا در ثبت تأمین‌کننده: '+supErr.message+'</div>'; return; }
    supplier = newSup;
  }

  const { error } = await sb.from("supplier_quotes").insert({
    sourcing_request_id: sourcingId, supplier_id: supplier.id,
    purchase_price: price, shipping_cost: ship,
    estimated_delivery_days: days, risk_level: risk
  });
  if(error){ msg.innerHTML = '<div class="err">خطا: '+error.message+'</div>'; return; }

  await sb.from("sourcing_requests").update({ status: "offers_received" }).eq("id", sourcingId).eq("status","new");
  msg.innerHTML = '<div class="ok">پیشنهاد ثبت شد.</div>';
  loadQuotesFor(sourcingId);
}
window.addQuote = addQuote;

async function chooseQuote(sourcingId, quoteId, total){
  const purCode = "PUR-" + Date.now().toString().slice(-8);
  const { data: sr } = await sb.from("sourcing_requests").select("job_id,customer_id").eq("id", sourcingId).maybeSingle();
  const { data: q } = await sb.from("supplier_quotes").select("supplier_id").eq("id", quoteId).maybeSingle();

  const { error } = await sb.from("purchases").insert({
    code: purCode, supplier_id: q.supplier_id, sourcing_request_id: sourcingId,
    job_id: sr ? sr.job_id : null, status: "ordered", purchase_total: total, ordered_at: new Date().toISOString()
  });
  if(error){ alert("خطا: "+error.message); return; }

  await sb.from("sourcing_requests").update({ status: "ordered" }).eq("id", sourcingId);
  loadPendingSourcing();
  loadOrderedSourcing();
}
window.chooseQuote = chooseQuote;

async function loadOrderedSourcing(){
  const el = document.getElementById("orderedSourcingList");
  const { data, error } = await sb.from("sourcing_requests")
    .select("id,code,item_name,quantity,job_id,customer_id,part_id,status")
    .in("status", ["ordered","shipping"]);

  if(error){ el.innerHTML = '<div class="listcard err">خطا: '+error.message+'</div>'; return; }
  if(!data || data.length===0){ el.innerHTML = '<div class="empty">سفارش در حال تأمینی نیست.</div>'; return; }

  el.innerHTML = data.map(s => `
    <div class="listcard">
      <h3>${s.item_name} (${s.quantity}) ${badge(s.status)}</h3>
      <button class="approve" onclick="markReceived('${s.id}')">دریافت شد — اتصال به کار</button>
      <div id="recvmsg-${s.id}"></div>
    </div>
  `).join("");
}

async function markReceived(sourcingId){
  const msg = document.getElementById("recvmsg-"+sourcingId);
  const { data: s, error: sErr } = await sb.from("sourcing_requests")
    .select("job_id,customer_id,part_id,quantity").eq("id", sourcingId).maybeSingle();
  if(sErr || !s){ msg.innerHTML = '<div class="err">خطا در خواندن درخواست</div>'; return; }

  if(s.part_id){
    const { error: smErr } = await sb.from("stock_movements").insert({
      part_id: s.part_id, quantity: s.quantity, reason: "repair",
      job_id: s.job_id, customer_id: s.customer_id, created_by: currentUser.id
    });
    if(smErr){ msg.innerHTML = '<div class="err">خطا: '+smErr.message+'</div>'; return; }
  }

  await sb.from("sourcing_requests").update({ status: "delivered" }).eq("id", sourcingId);
  await sb.from("purchases").update({ status: "received", received_at: new Date().toISOString() }).eq("sourcing_request_id", sourcingId);
  if(s.job_id){
    await sb.from("jobs").update({ status: "repairing" }).eq("id", s.job_id);
  }
  loadOrderedSourcing();
}
window.markReceived = markReceived;

// قیمت روز بازار
let mpTimer = null;
let mpSelected = null;
document.getElementById("mpPartSearch").oninput = (e) => {
  clearTimeout(mpTimer);
  const raw = e.target.value.trim();
  if(raw.length < 2){ document.getElementById("mpPartResults").innerHTML = ""; return; }
  mpTimer = setTimeout(async () => {
    const qFa = raw.replace(/ي/g,"ی").replace(/ك/g,"ک");
    const qAr = raw.replace(/ی/g,"ي").replace(/ک/g,"ك");
    const { data } = await sb.from("parts").select("id,name,sale_price")
      .or(`name.ilike.%${qFa}%,name.ilike.%${qAr}%,name.ilike.%${raw}%`).limit(8);
    const el = document.getElementById("mpPartResults");
    if(!data || data.length===0){ el.innerHTML = '<div class="meta">نتیجه‌ای یافت نشد.</div>'; return; }
    el.innerHTML = data.map(p => `<div class="row" style="cursor:pointer" onclick='selectMarketPart("${p.id}","${p.name.replace(/'/g,"")}",${p.sale_price||0})'><span>${p.name}</span></div>`).join("");
  }, 350);
};

function selectMarketPart(id, name, salePrice){
  mpSelected = id;
  document.getElementById("mpSelName").textContent = name;
  document.getElementById("mpSelPrice").textContent = salePrice.toLocaleString('fa-IR') + " ریال";
  document.getElementById("mpPartResults").innerHTML = "";
  document.getElementById("mpPartSearch").value = name;
  document.getElementById("mpSelectedBox").classList.remove("hidden");
  document.getElementById("mpTorobLink").href = "https://torob.com/search/?query=" + encodeURIComponent(name);
  document.getElementById("mpGoogleLink").href = "https://www.google.com/search?q=" + encodeURIComponent(name + " قیمت");
}
window.selectMarketPart = selectMarketPart;

document.getElementById("btnSaveMarketPrice").onclick = async () => {
  const msg = document.getElementById("mpMsg");
  const price = Number(document.getElementById("mpPrice").value);
  const source = document.getElementById("mpSource").value.trim();
  if(!mpSelected || !price){ msg.innerHTML = '<div class="err">قطعه و قیمت را وارد کنید.</div>'; return; }

  const { data: part } = await sb.from("parts").select("name").eq("id", mpSelected).maybeSingle();
  const { error } = await sb.from("market_prices").insert({
    part_id: mpSelected, item_name: part.name, price, source
  });
  if(error){ msg.innerHTML = '<div class="err">خطا: '+error.message+'</div>'; return; }
  msg.innerHTML = '<div class="ok">قیمت بازار ثبت شد.</div>';
  document.getElementById("mpPrice").value = "";
  document.getElementById("mpSource").value = "";
};

checkSession();
</script>
